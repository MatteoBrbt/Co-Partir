<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>CoPartir — Résultat</title>
  <link rel="icon" href="icons/icon-192.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #378ADD;
      --blue-dk: #185FA5;
      --green:   #1D9E75;
      --amber:   #D97706;
      --red:     #EF4444;
      --bg:      #F4F7FB;
      --card:    #ffffff;
      --border:  #e5e9f0;
      --text:    #1a2236;
      --muted:   #6b7280;
      --radius:  14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 500;
    }
    .back-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue-dk);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--bg); }
    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    /* ── Layout ───────────────────────────────────────────── */
    .page {
      display: flex;
      flex: 1;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      .page { flex-direction: row; }
    }

    /* ── Map ──────────────────────────────────────────────── */
    #map {
      flex: 1;
      min-height: 320px;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: 100%;
      background: var(--card);
      border-top: 1px solid var(--border);
      overflow-y: auto;
      padding: 18px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .sidebar {
        width: 320px;
        border-top: none;
        border-left: 1px solid var(--border);
      }
    }

    /* ── Meeting point hero ───────────────────────────────── */
    .meeting-hero {
      background: linear-gradient(135deg, #e6f1fb 0%, #dbeafe 100%);
      border: 1.5px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 16px;
    }
    .meeting-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue-dk);
      margin-bottom: 6px;
    }
    .meeting-address {
      font-size: 17px;
      font-weight: 700;
      color: var(--blue-dk);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .detour-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: white;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--blue-dk);
      border: 1px solid #bfdbfe;
    }

    /* ── Section titles ───────────────────────────────────── */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Point rows ───────────────────────────────────────── */
    .point-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .point-row:last-child { border-bottom: none; }

    .point-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .point-address {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }
    .point-coords {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Route legend ─────────────────────────────────────── */
    .legend {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--text);
    }
    .legend-line {
      width: 32px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-line.dashed {
      background: repeating-linear-gradient(
        90deg,
        currentColor 0px,
        currentColor 8px,
        transparent 8px,
        transparent 14px
      );
    }
    /* ORS / Haversine badge */
    .ors-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 2px;
      width: fit-content;
    }
    .ors-badge.real   { background: #ecfdf5; color: #065f46; border: 1px solid #bbf7d0; }
    .ors-badge.approx { background: #fff3cd; color: #856404; border: 1px solid #fde68a; }

    /* ── Stats ────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Destination card ─────────────────────────────────── */
    .dest-card {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dest-card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--green);
      margin-bottom: 3px;
    }
    .dest-card-address {
      font-size: 14px;
      font-weight: 600;
      color: #065f46;
    }

    /* ── Open maps button ─────────────────────────────────── */
    .osm-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .osm-btn:hover { background: var(--blue-dk); }

    /* ── No data fallback ─────────────────────────────────── */
    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }
    .no-data h2 { color: var(--text); font-size: 18px; }

    /* ── Custom Leaflet markers ───────────────────────────── */
    .leaflet-marker-icon.custom-marker {
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">← Retour</button>
    <div class="topbar-logo">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="14" fill="#378ADD"/>
        <path d="M14 6C10.69 6 8 8.69 8 12c0 5 6 10 6 10s6-5 6-10c0-3.31-2.69-6-6-6zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="white"/>
      </svg>
      CoPartir — Résultat
    </div>
  </div>

  <div class="page">
    <!-- Map -->
    <div id="map"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="no-data" id="no-data" style="display:none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#9ca3af" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/></svg>
        <h2>Aucun résultat</h2>
        <p>Retournez à l'accueil et lancez un calcul.</p>
        <a href="index.html" style="color:#378ADD;font-weight:600;">← Accueil</a>
      </div>
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (function () {
    const raw = sessionStorage.getItem('copartir_result');
    if (!raw) {
      document.getElementById('no-data').style.display = 'flex';
      return;
    }

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      document.getElementById('no-data').style.display = 'flex';
      return;
    }

    if (!data?.meetingPoint || !data?.destination || !Array.isArray(data?.startPoints)) {
      document.getElementById('no-data').style.display = 'flex';
      return;
    }

    const {
      meetingPoint,
      destination,
      startPoints,
      mode,
      stats,
      routes,
      usedORS,
      placeTypeLabel,
      nearbyMeetingSpots,
    } = data;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDetourValue(value, currentMode) {
      if (value == null) return null;

      if (currentMode === 'short') {
        return typeof value === 'number' ? `${value.toFixed(1)} km` : `${value} km`;
      }

      if (typeof value === 'string') return value;

      const totalSeconds = Math.max(0, Math.round(value));
      const minutes = Math.floor(totalSeconds / 60);
      const remainingSeconds = totalSeconds % 60;

      if (minutes <= 0) return `${remainingSeconds}`;
      return `${minutes} min ${remainingSeconds}`;
    }

    // ─── Palette cohérente avec app.js ─────────────────────────
    // Ordre : bleu, vert, amber, rose, violet, orange
    const AVATAR_COLORS = [
      { bg: '#e6f1fb', text: '#185FA5' },
      { bg: '#e1f5ee', text: '#0F6E56' },
      { bg: '#faeeda', text: '#854F0B' },
      { bg: '#fbeaf0', text: '#993556' },
      { bg: '#eeedfe', text: '#3C3489' },
      { bg: '#faece7', text: '#993C1D' },
    ];
    // Couleurs pleine des tracés (même ordre)
    const ROUTE_COLORS = ['#185FA5', '#0F6E56', '#854F0B', '#993556', '#3C3489', '#993C1D'];
    // Couleurs des pins départ (légèrement plus claires pour contraster avec les tracés)
    const PIN_COLORS   = ['#4B8FD6', '#25B888', '#F59E0B', '#EC4899', '#7C6FCD', '#EF6C00'];

    // ── Build sidebar ─────────────────────────────────────────

    const sidebar = document.getElementById('sidebar');
    const meetingAddressText = meetingPoint.address || `Coordonnées : ${meetingPoint.lat.toFixed(4)}, ${meetingPoint.lon.toFixed(4)}`;
    const destinationAddressText = destination.address || `${destination.lat.toFixed(4)}, ${destination.lon.toFixed(4)}`;
    const detourText = formatDetourValue(meetingPoint.detourKm, mode) || 'n/a';
    const collectiveDetourText = formatDetourValue(stats?.totalDetourKm, mode) || '—';
    const safePlaceTypeLabel = escapeHtml(placeTypeLabel || 'Parking public / municipal');

    sidebar.innerHTML = `
      <div class="meeting-hero">
        <div class="meeting-label">📍 Point de ralliement</div>
        <div class="meeting-address">${escapeHtml(meetingAddressText)}</div>
        <div class="detour-badge">
          <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M10 2L2 11h7l-1 7 9-10h-7l1-8z" fill="#185FA5"/></svg>
          Détour total : ${escapeHtml(detourText)}
        </div>
      </div>

      <div class="section-title">Points possibles à proximité</div>
      <div id="nearby-spots-wrap">
        ${(Array.isArray(nearbyMeetingSpots) && nearbyMeetingSpots.length > 0)
          ? `
            <div class="nearby-spots-meta">Type recherché : ${safePlaceTypeLabel}</div>
            <div id="nearby-spots-list"></div>
          `
          : `<div class="nearby-spots-empty">Aucun lieu proche trouvé pour ce type autour du point calculé.</div>`
        }
      </div>

      <div class="dest-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z" fill="#1D9E75"/></svg>
        <div>
          <div class="dest-card-label">🏁 Destination</div>
          <div class="dest-card-address">${escapeHtml(destinationAddressText)}</div>
        </div>
      </div>

      <div class="section-title">Points de départ</div>
      <div id="starts-list"></div>

      <div class="section-title">Tracés sur la carte</div>
      <div class="legend" id="route-legend"></div>

      <div class="section-title">Statistiques</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${startPoints.length}</div>
          <div class="stat-label">Participants</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats?.candidatesEvaluated ?? '—'}</div>
          <div class="stat-label">Candidats évalués</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${escapeHtml(collectiveDetourText)}</div>
          <div class="stat-label">Détour collectif</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${mode === 'fast' ? '⚡ Temps' : '📏 Distance'}</div>
          <div class="stat-label">Critère</div>
        </div>
      </div>

      <a class="osm-btn"
         href="https://www.openstreetmap.org/?mlat=${meetingPoint.lat}&mlon=${meetingPoint.lon}#map=15/${meetingPoint.lat}/${meetingPoint.lon}"
         target="_blank" rel="noopener">
        Ouvrir dans OpenStreetMap ↗
      </a>
    `;

    // Start points list
    const startsList = document.getElementById('starts-list');
    startPoints.forEach((pt, i) => {
      const col    = AVATAR_COLORS[i % AVATAR_COLORS.length];
      const letter = String.fromCharCode(65 + i);
      const startAddressText = pt.address || `Participant ${letter}`;
      const row    = document.createElement('div');
      row.className = 'point-row';
      row.innerHTML = `
        <div class="point-dot" style="background:${col.bg};color:${col.text}">${letter}</div>
        <div>
          <div class="point-address">${escapeHtml(startAddressText)}</div>
          <div class="point-coords">${pt.lat.toFixed(5)}, ${pt.lon.toFixed(5)}</div>
        </div>`;
      startsList.appendChild(row);
    });

    // Nearby meeting spots list (max 3)
    const nearbyList = document.getElementById('nearby-spots-list');
    if (nearbyList && Array.isArray(nearbyMeetingSpots)) {
      nearbyMeetingSpots.slice(0, 3).forEach((spot, i) => {
        const spotName = spot.name || `Point possible ${i + 1}`;
        const row = document.createElement('div');
        row.className = 'point-row nearby-spot-row';
        row.innerHTML = `
          <div class="point-dot" style="background:#fff4e5;color:#b45309">${i + 1}</div>
          <div>
            <div class="point-address">${escapeHtml(spotName)}</div>
            <div class="point-coords">${spot.lat.toFixed(5)}, ${spot.lon.toFixed(5)} • ${spot.distanceKm.toFixed(2)} km</div>
          </div>`;
        nearbyList.appendChild(row);
      });
    }

    // Route legend
    const legend = document.getElementById('route-legend');

    // ORS / Haversine badge
    const badgeHtml = usedORS
      ? `<span class="ors-badge real">✓ Tracés routiers réels (OpenRouteService)</span>`
      : `<span class="ors-badge approx">~ Tracés approximatifs (lignes droites)</span>`;

    let legendHtml = badgeHtml;

    // One legend row per participant
    startPoints.forEach((_, i) => {
      const color  = ROUTE_COLORS[i % ROUTE_COLORS.length];
      const letter = String.fromCharCode(65 + i);
      legendHtml += `
        <div class="legend-row">
          <svg width="32" height="8" style="flex-shrink:0">
            <line x1="0" y1="4" x2="32" y2="4"
                  stroke="${color}" stroke-width="3.5"
                  stroke-dasharray="9 6" stroke-linecap="round"/>
          </svg>
          Participant ${letter} → Ralliement
        </div>`;
    });

    legendHtml += `
      <div class="legend-row">
        <svg width="32" height="8" style="flex-shrink:0">
          <line x1="0" y1="4" x2="32" y2="4"
                stroke="#1D9E75" stroke-width="4" stroke-linecap="round"/>
        </svg>
        Trajet commun → Destination
      </div>`;

    legend.innerHTML = legendHtml;

    // ── Build map ─────────────────────────────────────────────

    const allPts = [
      [meetingPoint.lat, meetingPoint.lon],
      [destination.lat,  destination.lon],
      ...startPoints.map(p => [p.lat, p.lon]),
    ];

    const map = L.map('map');

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);

    // ── Draw routes ───────────────────────────────────────────
    // Drawn BEFORE markers so markers sit on top

    if (routes && routes.length > 0) {
      let sharedDrawn = false;

      routes.forEach((route, i) => {
        const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
        const letter = String.fromCharCode(65 + i);

        // Départ_i → meeting  (tirets colorés, spécifique à chaque participant)
        if (route.toMeeting && route.toMeeting.length > 1) {
          L.polyline(route.toMeeting, {
            color,
            weight: 4,
            opacity: 0.88,
            dashArray: '10 7',
            lineJoin: 'round',
          })
          .addTo(map)
          .bindTooltip(`Participant ${letter} → Ralliement`, {
            sticky: true,
            className: 'leaflet-tooltip',
          });
        }

        // Meeting → destination (trait plein vert, dessiné une seule fois)
        if (!sharedDrawn && route.toDestination && route.toDestination.length > 1) {
          L.polyline(route.toDestination, {
            color: '#1D9E75',
            weight: 5,
            opacity: 0.92,
            lineJoin: 'round',
          })
          .addTo(map)
          .bindTooltip('Trajet commun → Destination', {
            sticky: true,
          });
          sharedDrawn = true;
        }
      });

      // Ajuste le zoom pour englober tous les tracés
      const routePoints = routes.flatMap(r => [
        ...(r.toMeeting     || []),
        ...(r.toDestination || []),
      ]);
      if (routePoints.length > 1) {
        map.fitBounds(L.latLngBounds(routePoints).pad(0.1));
      } else {
        map.fitBounds(allPts, { padding: [40, 40] });
      }
    } else {
      // Pas de routes : tracés droits de fallback + fitBounds classique
      startPoints.forEach((sp, i) => {
        const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
        L.polyline([[sp.lat, sp.lon], [meetingPoint.lat, meetingPoint.lon]], {
          color,
          weight: 3,
          opacity: 0.6,
          dashArray: '8 6',
        }).addTo(map);
      });
      L.polyline(
        [[meetingPoint.lat, meetingPoint.lon], [destination.lat, destination.lon]],
        { color: '#1D9E75', weight: 4, opacity: 0.75 }
      ).addTo(map);
      map.fitBounds(allPts, { padding: [40, 40] });
    }

    // ── Markers (au-dessus des tracés) ────────────────────────

    function makePin(color, letter, size = 36) {
      const h = Math.round(size * 1.3);
      const html = `
        <svg width="${size}" height="${h}" viewBox="0 0 36 47" xmlns="http://www.w3.org/2000/svg">
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.22"/>
          </filter>
          <path d="M18 1C9.72 1 3 7.72 3 16c0 10.5 15 30 15 30S33 26.5 33 16C33 7.72 26.28 1 18 1z"
                fill="${color}" stroke="white" stroke-width="2" filter="url(#sh)"/>
          <circle cx="18" cy="16" r="9" fill="white" opacity="0.22"/>
          <text x="18" y="21" text-anchor="middle" font-size="12"
                font-family="system-ui,sans-serif" font-weight="800" fill="white">${letter}</text>
        </svg>`;
      return L.divIcon({
        html,
        className: 'custom-marker',
        iconSize:   [size, h],
        iconAnchor: [size / 2, h],
        popupAnchor: [0, -h],
      });
    }

    // Départs
    startPoints.forEach((pt, i) => {
      const letter = String.fromCharCode(65 + i);
      const color  = PIN_COLORS[i % PIN_COLORS.length];
      const startPopupAddress = escapeHtml(pt.address || '');
      L.marker([pt.lat, pt.lon], { icon: makePin(color, letter), zIndexOffset: 100 })
        .addTo(map)
        .bindPopup(`<b>Départ ${letter}</b><br>${startPopupAddress}`, { maxWidth: 240 });
    });

    // Destination
    const destinationPopupAddress = escapeHtml(destination.address || '');
    L.marker([destination.lat, destination.lon], {
      icon: makePin('#1D9E75', '🏁', 38),
      zIndexOffset: 200,
    })
    .addTo(map)
    .bindPopup(`<b>Destination</b><br>${destinationPopupAddress}`, { maxWidth: 240 })
    .openPopup();

    // Point de ralliement — cercle de zone + pin étoile
    L.circle([meetingPoint.lat, meetingPoint.lon], {
      radius: 800,
      color: '#D97706',
      fillColor: '#FCD34D',
      fillOpacity: 0.15,
      weight: 2,
      dashArray: '6 4',
    }).addTo(map);

    L.marker([meetingPoint.lat, meetingPoint.lon], {
      icon: makePin('#D97706', '★', 44),
      zIndexOffset: 300,
    })
    .addTo(map)
    .bindPopup(
      `<b>📍 Point de ralliement</b><br>${escapeHtml(meetingPoint.address || '')}<br>` +
      (meetingPoint.detourKm != null
        ? `Détour collectif : <b>${escapeHtml(formatDetourValue(meetingPoint.detourKm, mode))}</b>`
        : ''),
      { maxWidth: 260 }
    );

  })();
  </script>
</body>
</html>
