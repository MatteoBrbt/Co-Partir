<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>CovoiPoint — Résultat</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #378ADD;
      --blue-dk: #185FA5;
      --green:   #1D9E75;
      --amber:   #D97706;
      --red:     #EF4444;
      --bg:      #F4F7FB;
      --card:    #ffffff;
      --border:  #e5e9f0;
      --text:    #1a2236;
      --muted:   #6b7280;
      --radius:  14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 500;
    }
    .back-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue-dk);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--bg); }
    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    /* ── Layout ───────────────────────────────────────────── */
    .page {
      display: flex;
      flex: 1;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      .page { flex-direction: row; }
    }

    /* ── Map ──────────────────────────────────────────────── */
    #map {
      flex: 1;
      min-height: 320px;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: 100%;
      background: var(--card);
      border-top: 1px solid var(--border);
      overflow-y: auto;
      padding: 18px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .sidebar {
        width: 340px;
        border-top: none;
        border-left: 1px solid var(--border);
      }
    }

    /* ── Meeting point hero ───────────────────────────────── */
    .meeting-hero {
      background: linear-gradient(135deg, #e6f1fb 0%, #dbeafe 100%);
      border: 1.5px solid #bfdbfe;
      border-radius: var(--radius);
      padding: 16px;
    }
    .meeting-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue-dk);
      margin-bottom: 6px;
    }
    .meeting-address {
      font-size: 16px;
      font-weight: 700;
      color: var(--blue-dk);
      line-height: 1.3;
      margin-bottom: 12px;
    }

    /* ── Détour stats row ─────────────────────────────────── */
    .detour-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .detour-stat {
      background: white;
      border-radius: 10px;
      padding: 9px 11px;
      border: 1px solid #bfdbfe;
    }
    .detour-stat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b93c4;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .detour-stat-value {
      font-size: 17px;
      font-weight: 800;
      color: var(--blue-dk);
      line-height: 1;
    }
    .detour-stat-sub {
      font-size: 11px;
      color: #6b93c4;
      margin-top: 2px;
    }

    /* ── Section titles ───────────────────────────────────── */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Meeting point switcher ───────────────────────────── */
    .meeting-switcher {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .switcher-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.18s ease;
      background: var(--card);
      position: relative;
      text-align: left;
      width: 100%;
    }
    .switcher-card:hover {
      border-color: #93c5fd;
      background: #f0f7ff;
      transform: translateX(2px);
    }
    .switcher-card.active {
      border-color: var(--blue);
      background: #e6f1fb;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
    }
    .switcher-card.active .switcher-card-name {
      color: var(--blue-dk);
      font-weight: 700;
    }
    .switcher-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .switcher-dot.optimal {
      background: #fef3c7;
      color: #b45309;
    }
    .switcher-dot.nearby {
      background: #f0fdf4;
      color: #15803d;
    }
    .switcher-card-info {
      flex: 1;
      min-width: 0;
    }
    .switcher-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .switcher-card-dist {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .switcher-card-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .switcher-card-badge.recommended {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .switcher-card-badge.nearby-badge {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .switcher-active-check {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      background: var(--blue);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .switcher-card.active .switcher-active-check {
      display: flex;
    }
    .switcher-tip {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* ── Point rows ───────────────────────────────────────── */
    .point-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .point-row:last-child { border-bottom: none; }

    .point-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .point-address {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }
    .point-coords {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Route legend ─────────────────────────────────────── */
    .legend {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--text);
    }
    .legend-line {
      width: 32px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .ors-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 2px;
      width: fit-content;
    }
    .ors-badge.real   { background: #ecfdf5; color: #065f46; border: 1px solid #bbf7d0; }
    .ors-badge.approx { background: #fff3cd; color: #856404; border: 1px solid #fde68a; }

    /* ── Stats ────────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-card {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Destination card ─────────────────────────────────── */
    .dest-card {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dest-card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--green);
      margin-bottom: 3px;
    }
    .dest-card-address {
      font-size: 14px;
      font-weight: 600;
      color: #065f46;
    }

    /* ── Open maps button ─────────────────────────────────── */
    .osm-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--blue);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .osm-btn:hover { background: var(--blue-dk); }

    /* ── No data fallback ─────────────────────────────────── */
    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }
    .no-data h2 { color: var(--text); font-size: 18px; }

    /* ── Custom Leaflet markers ───────────────────────────── */
    .leaflet-marker-icon.custom-marker {
      background: none;
      border: none;
    }

    /* ── Map transition feedback ──────────────────────────── */
    .map-switch-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(24, 95, 165, 0.93);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 20px;
      z-index: 9999;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .map-switch-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">← Retour</button>
    <div class="topbar-logo">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="14" fill="#378ADD"/>
        <path d="M14 6C10.69 6 8 8.69 8 12c0 5 6 10 6 10s6-5 6-10c0-3.31-2.69-6-6-6zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="white"/>
      </svg>
      CovoiPoint — Résultat
    </div>
  </div>

  <div class="page">
    <div id="map"></div>
    <div class="sidebar" id="sidebar">
      <div class="no-data" id="no-data" style="display:none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#9ca3af" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/></svg>
        <h2>Aucun résultat</h2>
        <p>Retournez à l'accueil et lancez un calcul.</p>
        <a href="index.html" style="color:#378ADD;font-weight:600;">← Accueil</a>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="map-switch-toast" id="map-toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (function () {
    const raw = sessionStorage.getItem('covoipoint_result');
    if (!raw) { document.getElementById('no-data').style.display = 'flex'; return; }

    let data;
    try { data = JSON.parse(raw); } catch { document.getElementById('no-data').style.display = 'flex'; return; }

    if (!data?.meetingPoint || !data?.destination || !Array.isArray(data?.startPoints)) {
      document.getElementById('no-data').style.display = 'flex'; return;
    }

    const { meetingPoint, destination, startPoints, mode, stats, routes, usedORS, placeTypeLabel, nearbyMeetingSpots } = data;

    // ── Helpers ──────────────────────────────────────────────
    function escapeHtml(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /**
     * Formate un score ORS (secondes si mode fast, mètres si mode short)
     * en chaîne lisible.
     */
    function formatScore(value, currentMode) {
      if (value == null) return '—';
      if (currentMode === 'short') {
        const km = typeof value === 'number' ? value / 1000 : parseFloat(value);
        return isNaN(km) ? String(value) : `${km.toFixed(1)} km`;
      }
      // mode fast : value est en secondes (nombre) ou déjà formaté (string "X min Y")
      if (typeof value === 'string') return value;
      const totalSeconds = Math.max(0, Math.round(value));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      if (m <= 0) return `${s} sec`;
      return s > 0 ? `${m} min ${s}` : `${m} min`;
    }

    /**
     * Calcule un détour par participant à partir du score collectif ORS.
     * Le score ORS = Σ(participant→candidat) + N×(candidat→destination)
     * On divise par N pour avoir une approximation par tête.
     */
    function detourPerParticipant(collectiveScore, n, currentMode) {
      if (collectiveScore == null || n <= 0) return '—';
      // Si déjà une string (old format), on ne peut pas diviser
      if (typeof collectiveScore === 'string') return collectiveScore;
      const perHead = collectiveScore / n;
      return formatScore(perHead, currentMode);
    }

    /**
     * Estime le temps de trajet commun (point de ralliement → destination)
     * à partir des données de route si disponibles.
     */
    function estimateSharedLegTime(routes) {
      if (!routes || !routes[0]?.toDestination) return null;
      // On ne peut pas connaître le temps exact sans données ORS sur ce tronçon.
      // On retourne null pour ne pas afficher une valeur fausse.
      return null;
    }

    // ── Palette ───────────────────────────────────────────────
    const AVATAR_COLORS = [
      { bg: '#e6f1fb', text: '#185FA5' },
      { bg: '#e1f5ee', text: '#0F6E56' },
      { bg: '#faeeda', text: '#854F0B' },
      { bg: '#fbeaf0', text: '#993556' },
      { bg: '#eeedfe', text: '#3C3489' },
      { bg: '#faece7', text: '#993C1D' },
    ];
    const ROUTE_COLORS = ['#185FA5','#0F6E56','#854F0B','#993556','#3C3489','#993C1D'];
    const PIN_COLORS   = ['#4B8FD6','#25B888','#F59E0B','#EC4899','#7C6FCD','#EF6C00'];

    // ── State ─────────────────────────────────────────────────
    let activeMeetingIdx = 0; // 0 = point calculé, 1..3 = points proches

    // Build the list of all switchable meeting points
    const allMeetingOptions = [
      {
        lat: meetingPoint.lat,
        lon: meetingPoint.lon,
        name: meetingPoint.address || `${meetingPoint.lat.toFixed(4)}, ${meetingPoint.lon.toFixed(4)}`,
        isOptimal: true,
      },
      ...(Array.isArray(nearbyMeetingSpots) ? nearbyMeetingSpots : []).slice(0, 3).map(s => ({
        lat: s.lat,
        lon: s.lon,
        name: s.name || `${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}`,
        distanceKm: s.distanceKm,
        isOptimal: false,
      })),
    ];

    // ── Sidebar ───────────────────────────────────────────────
    const n = startPoints.length;
    const collectiveScore = stats?.totalDetourKm ?? meetingPoint.detourKm;
    const perParticipantText = detourPerParticipant(collectiveScore, n, mode);

    // Label for mode
    const modeLabel = mode === 'fast' ? 'par participant' : 'par participant';
    const modeIcon  = mode === 'fast' ? '⏱' : '📏';
    const modeUnit  = mode === 'fast' ? 'détour estimé' : 'distance supplémentaire';

    // Shared leg label
    const sharedLegText = '→ Destination commune';

    const destinationAddressText = destination.address || `${destination.lat.toFixed(4)}, ${destination.lon.toFixed(4)}`;
    const safePlaceTypeLabel = escapeHtml(placeTypeLabel || 'Parking public / municipal');

    const sidebar = document.getElementById('sidebar');

    // Build switcher cards HTML
    let switcherHtml = '';
    allMeetingOptions.forEach((opt, i) => {
      const dotLabel = opt.isOptimal ? '★' : (i);
      const dotClass = opt.isOptimal ? 'optimal' : 'nearby';
      const badge = opt.isOptimal
        ? `<span class="switcher-card-badge recommended">Recommandé</span>`
        : `<span class="switcher-card-badge nearby-badge">${opt.distanceKm != null ? opt.distanceKm.toFixed(2) + ' km' : ''}</span>`;
      const activeClass = i === 0 ? 'active' : '';
      switcherHtml += `
        <button class="switcher-card ${activeClass}" data-idx="${i}" onclick="switchMeetingPoint(${i})">
          <div class="switcher-dot ${dotClass}">${dotLabel}</div>
          <div class="switcher-card-info">
            <div class="switcher-card-name">${escapeHtml(opt.name)}</div>
            <div class="switcher-card-dist">${opt.isOptimal ? 'Point calculé par l\'algorithme' : `${opt.distanceKm != null ? opt.distanceKm.toFixed(2) + ' km du point optimal' : 'Point alternatif'}`}</div>
          </div>
          ${badge}
          <div class="switcher-active-check">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>`;
    });

    sidebar.innerHTML = `
      <!-- Hero point de ralliement -->
      <div class="meeting-hero">
        <div class="meeting-label">📍 Point de ralliement</div>
        <div class="meeting-address" id="active-meeting-address">${escapeHtml(allMeetingOptions[0].name)}</div>

        <!-- Détour stats -->
        <div class="detour-stats">
          <div class="detour-stat">
            <div class="detour-stat-label">${modeIcon} Détour estimé</div>
            <div class="detour-stat-value" id="detour-per-participant">${perParticipantText}</div>
            <div class="detour-stat-sub">${modeLabel}</div>
          </div>
          <div class="detour-stat">
            <div class="detour-stat-label">🚗 Trajet commun</div>
            <div class="detour-stat-value" id="shared-leg-value">—</div>
            <div class="detour-stat-sub">rallye → destination</div>
          </div>
        </div>
      </div>

      <!-- Switcher de point de ralliement -->
      <div>
        <div class="section-title" style="margin-bottom:10px;">Choisir le point de ralliement</div>
        ${allMeetingOptions.length > 1
          ? `<div class="meeting-switcher" id="meeting-switcher">${switcherHtml}</div>
             <div class="switcher-tip">
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#9ca3af" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/></svg>
               Cliquez pour repositionner le pin sur la carte
             </div>`
          : `<div class="meeting-switcher" id="meeting-switcher">${switcherHtml}</div>
             <div class="switcher-tip" style="color:#d97706">Aucun lieu alternatif trouvé à proximité</div>`
        }
      </div>

      <!-- Destination -->
      <div class="dest-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5z" fill="#1D9E75"/></svg>
        <div>
          <div class="dest-card-label">🏁 Destination</div>
          <div class="dest-card-address">${escapeHtml(destinationAddressText)}</div>
        </div>
      </div>

      <!-- Points de départ -->
      <div class="section-title">Points de départ</div>
      <div id="starts-list"></div>

      <!-- Tracés -->
      <div class="section-title">Tracés sur la carte</div>
      <div class="legend" id="route-legend"></div>

      <!-- Stats -->
      <div class="section-title">Statistiques</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${n}</div>
          <div class="stat-label">Participants</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats?.candidatesEvaluated ?? '—'}</div>
          <div class="stat-label">Candidats évalués</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${escapeHtml(formatScore(collectiveScore, mode))}</div>
          <div class="stat-label">Score collectif</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${mode === 'fast' ? '⚡ Temps' : '📏 Distance'}</div>
          <div class="stat-label">Critère</div>
        </div>
      </div>

      <a class="osm-btn" id="osm-link"
         href="https://www.openstreetmap.org/?mlat=${meetingPoint.lat}&mlon=${meetingPoint.lon}#map=15/${meetingPoint.lat}/${meetingPoint.lon}"
         target="_blank" rel="noopener">
        Ouvrir dans OpenStreetMap ↗
      </a>
    `;

    // Start points list
    const startsList = document.getElementById('starts-list');
    startPoints.forEach((pt, i) => {
      const col    = AVATAR_COLORS[i % AVATAR_COLORS.length];
      const letter = String.fromCharCode(65 + i);
      const row    = document.createElement('div');
      row.className = 'point-row';
      row.innerHTML = `
        <div class="point-dot" style="background:${col.bg};color:${col.text}">${letter}</div>
        <div>
          <div class="point-address">${escapeHtml(pt.address || `Participant ${letter}`)}</div>
          <div class="point-coords">${pt.lat.toFixed(5)}, ${pt.lon.toFixed(5)}</div>
        </div>`;
      startsList.appendChild(row);
    });

    // Route legend
    const legend = document.getElementById('route-legend');
    const badgeHtml = usedORS
      ? `<span class="ors-badge real">✓ Tracés routiers réels (OpenRouteService)</span>`
      : `<span class="ors-badge approx">~ Tracés approximatifs (lignes droites)</span>`;
    let legendHtml = badgeHtml;
    startPoints.forEach((_, i) => {
      const color  = ROUTE_COLORS[i % ROUTE_COLORS.length];
      const letter = String.fromCharCode(65 + i);
      legendHtml += `
        <div class="legend-row">
          <svg width="32" height="8" style="flex-shrink:0">
            <line x1="0" y1="4" x2="32" y2="4" stroke="${color}" stroke-width="3.5"
                  stroke-dasharray="9 6" stroke-linecap="round"/>
          </svg>
          Participant ${letter} → Ralliement
        </div>`;
    });
    legendHtml += `
      <div class="legend-row">
        <svg width="32" height="8" style="flex-shrink:0">
          <line x1="0" y1="4" x2="32" y2="4" stroke="#1D9E75" stroke-width="4" stroke-linecap="round"/>
        </svg>
        Trajet commun → Destination
      </div>`;
    legend.innerHTML = legendHtml;

    // ── Map ───────────────────────────────────────────────────
    const allPts = [
      [meetingPoint.lat, meetingPoint.lon],
      [destination.lat,  destination.lon],
      ...startPoints.map(p => [p.lat, p.lon]),
    ];

    const map = L.map('map');
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);

    // ── Marker factory ────────────────────────────────────────
    function makePin(color, label, size = 36) {
      const h = Math.round(size * 1.3);
      const html = `
        <svg width="${size}" height="${h}" viewBox="0 0 36 47" xmlns="http://www.w3.org/2000/svg">
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.22"/>
          </filter>
          <path d="M18 1C9.72 1 3 7.72 3 16c0 10.5 15 30 15 30S33 26.5 33 16C33 7.72 26.28 1 18 1z"
                fill="${color}" stroke="white" stroke-width="2" filter="url(#sh)"/>
          <circle cx="18" cy="16" r="9" fill="white" opacity="0.22"/>
          <text x="18" y="21" text-anchor="middle" font-size="12"
                font-family="system-ui,sans-serif" font-weight="800" fill="white">${label}</text>
        </svg>`;
      return L.divIcon({ html, className: 'custom-marker', iconSize: [size, h], iconAnchor: [size/2, h], popupAnchor: [0, -h] });
    }

    // ── Draw routes ───────────────────────────────────────────
    if (routes && routes.length > 0) {
      let sharedDrawn = false;
      routes.forEach((route, i) => {
        const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
        const letter = String.fromCharCode(65 + i);
        if (route.toMeeting && route.toMeeting.length > 1) {
          L.polyline(route.toMeeting, { color, weight: 4, opacity: 0.88, dashArray: '10 7', lineJoin: 'round' })
            .addTo(map)
            .bindTooltip(`Participant ${letter} → Ralliement`, { sticky: true });
        }
        if (!sharedDrawn && route.toDestination && route.toDestination.length > 1) {
          L.polyline(route.toDestination, { color: '#1D9E75', weight: 5, opacity: 0.92, lineJoin: 'round' })
            .addTo(map)
            .bindTooltip('Trajet commun → Destination', { sticky: true });
          sharedDrawn = true;

          // Estimate shared leg duration from polyline point count as rough proxy
          // Real duration would require an ORS call — we skip that here
        }
      });
      const routePoints = routes.flatMap(r => [...(r.toMeeting||[]), ...(r.toDestination||[])]);
      if (routePoints.length > 1) {
        map.fitBounds(L.latLngBounds(routePoints).pad(0.1));
      } else {
        map.fitBounds(allPts, { padding: [40, 40] });
      }
    } else {
      startPoints.forEach((sp, i) => {
        L.polyline([[sp.lat, sp.lon], [meetingPoint.lat, meetingPoint.lon]], {
          color: ROUTE_COLORS[i % ROUTE_COLORS.length], weight: 3, opacity: 0.6, dashArray: '8 6',
        }).addTo(map);
      });
      L.polyline([[meetingPoint.lat, meetingPoint.lon], [destination.lat, destination.lon]],
        { color: '#1D9E75', weight: 4, opacity: 0.75 }).addTo(map);
      map.fitBounds(allPts, { padding: [40, 40] });
    }

    // ── Static markers: starts + destination ──────────────────
    startPoints.forEach((pt, i) => {
      const letter = String.fromCharCode(65 + i);
      L.marker([pt.lat, pt.lon], { icon: makePin(PIN_COLORS[i % PIN_COLORS.length], letter), zIndexOffset: 100 })
        .addTo(map)
        .bindPopup(`<b>Départ ${letter}</b><br>${escapeHtml(pt.address || '')}`, { maxWidth: 240 });
    });

    L.marker([destination.lat, destination.lon], { icon: makePin('#1D9E75', '🏁', 38), zIndexOffset: 200 })
      .addTo(map)
      .bindPopup(`<b>Destination</b><br>${escapeHtml(destination.address || '')}`, { maxWidth: 240 })
      .openPopup();

    // ── Meeting point marker (mutable) ────────────────────────
    let meetingCircle = L.circle([meetingPoint.lat, meetingPoint.lon], {
      radius: 800, color: '#D97706', fillColor: '#FCD34D', fillOpacity: 0.15, weight: 2, dashArray: '6 4',
    }).addTo(map);

    let meetingMarker = L.marker([meetingPoint.lat, meetingPoint.lon], {
      icon: makePin('#D97706', '★', 44),
      zIndexOffset: 300,
    }).addTo(map).bindPopup(
      `<b>📍 Point de ralliement</b><br>${escapeHtml(meetingPoint.address || '')}<br>` +
      (collectiveScore != null ? `Détour ${modeIcon} : <b>${escapeHtml(perParticipantText)}</b> par participant` : ''),
      { maxWidth: 260 }
    );

    // ── Nearby spot markers (ghost, shown when active) ────────
    const nearbyMarkers = allMeetingOptions.slice(1).map((opt, i) => {
      const idx = i + 1;
      const marker = L.marker([opt.lat, opt.lon], {
        icon: makePin('#6b7280', String(idx), 32),
        zIndexOffset: 150,
        opacity: 0.45,
      }).addTo(map)
        .bindPopup(`<b>Point alternatif ${idx}</b><br>${escapeHtml(opt.name)}<br>${opt.distanceKm != null ? opt.distanceKm.toFixed(2) + ' km du point optimal' : ''}`, { maxWidth: 240 });
      return marker;
    });

    // ── Toast helper ──────────────────────────────────────────
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('map-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    // ── Switch meeting point ───────────────────────────────────
    window.switchMeetingPoint = function(idx) {
      if (idx === activeMeetingIdx) return;
      activeMeetingIdx = idx;

      const opt = allMeetingOptions[idx];

      // Update sidebar cards
      document.querySelectorAll('.switcher-card').forEach(card => {
        card.classList.toggle('active', parseInt(card.dataset.idx) === idx);
      });

      // Update hero address
      document.getElementById('active-meeting-address').textContent = opt.name;

      // Update OSM link
      document.getElementById('osm-link').href =
        `https://www.openstreetmap.org/?mlat=${opt.lat}&mlon=${opt.lon}#map=15/${opt.lat}/${opt.lon}`;

      // Move meeting marker + circle
      const latlng = L.latLng(opt.lat, opt.lon);
      meetingMarker.setLatLng(latlng);
      meetingMarker.setPopupContent(
        `<b>📍 Point de ralliement</b><br>${escapeHtml(opt.name)}` +
        (idx === 0 && collectiveScore != null ? `<br>Détour ${modeIcon} : <b>${escapeHtml(perParticipantText)}</b> par participant` : '')
      );
      meetingCircle.setLatLng(latlng);

      // Highlight / dim nearby markers
      nearbyMarkers.forEach((m, i) => {
        const isActive = (i + 1) === idx;
        m.setOpacity(isActive ? 0 : 0.45); // hide the selected one (it's now the main pin)
        m.setZIndexOffset(isActive ? 0 : 150);
      });

      // Pan to new location
      map.flyTo(latlng, Math.max(map.getZoom(), 13), { duration: 0.8 });

      // Toast
      const label = idx === 0 ? 'Point recommandé' : `Point alternatif ${idx}`;
      showToast(`📍 ${label} sélectionné`);
    };

  })();
  </script>
</body>
</html>
